[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dergsql"
version = "0.1.0"
description = "Database-backed dynamic emergency routing graph MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "neo4j>=5.18,<6.0",
  "pydantic-settings>=2.2,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1.0", "ruff>=0.3,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
